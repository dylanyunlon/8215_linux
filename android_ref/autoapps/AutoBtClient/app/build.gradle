plugins {
    id 'com.android.application'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.autochips.bluetooth"
        minSdk 26
        targetSdk 30
        versionCode 1
        flavorDimensions ""
        versionName versionTag()

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        //调试时或者有单独更新APK时候使用，发版本集成到系统，不需要签名,由Android.mk签名
        MT8163 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_mt8163.jks')
            storePassword 'hcnrd123'
        }
        UIS8581 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_uis8581.jks')
            storePassword 'hcnrd123'
        }
        AC8257 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_ac8257.jks')
            storePassword 'hcnrd123'
        }
        AC8227L {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_ac8227.jks')
            storePassword 'hcnrd123'
        }
        SM6225 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_sm6225.jks')
            storePassword 'hcnrd123'
        }
        RK3326 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('../security/platform_rk3326.jks')
            storePassword 'hcnrd123'
        }
    }

    // main 目录为各渠道公用
    productFlavors {
        // 渠道名字和 src 下的目录名一致
        mt8163 {
            signingConfig signingConfigs.MT8163
        }
        uis8581 {
            signingConfig signingConfigs.UIS8581
        }
        sm6225 {
            signingConfig signingConfigs.SM6225
        }

        ac8257 {
            signingConfig signingConfigs.SM6225
        }

        ac8227l {
            signingConfig signingConfigs.SM6225
        }
        rk3326 {
            signingConfig signingConfigs.MT8163
        }
    }

    buildTypes {
        all {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    if (System.properties['os.name'].toLowerCase().contains('windows') && isRemote) {
        // windows 环境，as 直接导入服务器代码编译会报错，将 build 目录指定到本地磁盘即可
        buildDir = "D:\\gradle_build_cache\\" + rootProject.name + "\\" + defaultConfig.versionCode
        Console.println("grale build cache dir : " + buildDir)
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                outputFileName = rootProject.getName() +".apk"
            }
    }
}

dependencies {
    implementation 'com.hcn.libs:skin2-support:1.0.3@aar'
    implementation 'com.hcn.libs:common-utils:1.1.3@aar'
    implementation 'com.hcn.libs:skin2-extend:1.0.4@aar'
    implementation 'com.hcn.libs:theme-utils:1.0.0@aar'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.hcn.libs:auto-compat:1.1.8@aar'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation project(":auto-utils")
    implementation project(":app-language")
}

static def versionTag() {
    def time = new Date().format("YYMMddHHmm", TimeZone.getTimeZone("GMT+8:00"))
    return "V.1.0." + time
}