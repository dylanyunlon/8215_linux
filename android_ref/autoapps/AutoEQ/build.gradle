ext {
    isRemote = project.hasProperty('is_remote') ? project.getProperty('is_remote').toBoolean() : false
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        maven {
            allowInsecureProtocol = true
            url = 'http://ssh.light-comm.com:6081/repository/hcnlibs-releases/'
        }
        maven {
            allowInsecureProtocol = true
            url 'http://ssh.light-comm.com:6081/repository/maven-central/'
        }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            allowInsecureProtocol = true
            url = 'http://ssh.light-comm.com:6081/repository/hcnlibs-releases/'
        }
        maven {
            allowInsecureProtocol = true
            url 'http://ssh.light-comm.com:6081/repository/maven-central/'
        }
        google()
    }

    ext {
        isRemote = rootProject.isRemote
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}