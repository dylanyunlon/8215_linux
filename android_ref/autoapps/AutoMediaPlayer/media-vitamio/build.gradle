plugins {
    id 'com.android.library'
}

android {
    namespace 'io.vov.vitamio'
    compileSdk project.compileSdk as int

    defaultConfig {
        minSdk project.minSdk as int
        targetSdk project.targetSdk as int

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    libraryVariants.configureEach { variant ->
        def buildType = variant.buildType.name
        def fileName
        def releaseDir = rootProject.getRootDir().getAbsolutePath() + "/release/";

        variant.outputs.each {
            if (buildType == "release") {
                fileName = "media-vitamio-${buildType}.aar"
                it.outputFileName = fileName
            }
        }

        variant.getAssembleProvider().configure() {
            it.doLast {
                File out = new File(releaseDir)
                copy {
                    variant.outputs.forEach { file ->
                        copy {
                            from file.outputFile
                            into out
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    compileOnly BuildConfig.libs.androidx_appcompat.path
    compileOnly BuildConfig.libs.androidx_material.path
}