plugins {
    id 'com.android.library'
}

android {
    namespace 'com.hcn.metadata'
    compileSdk project.compileSdk as int

    defaultConfig {
        minSdk project.minSdk as int
        targetSdk project.targetSdk as int
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a","armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    libraryVariants.configureEach { variant ->
        def releaseDir = rootProject.getRootDir().getAbsolutePath() + "/release/";
        def buildType = variant.buildType.name
        def fileName

        variant.outputs.each {
            if (buildType == "release") {
                fileName = "media-metadata-${buildType}.aar"
                it.outputFileName = fileName
            }
        }

        variant.getAssembleProvider().configure() {
            it.doLast {
                File out = new File(releaseDir)
                copy {
                    variant.outputs.forEach {
                        def provider = variant.packageLibraryProvider.get()
                        def file = provider.destinationDirectory.getAsFile().get()
                        copy {
                            from file
                            into out
                        }
                    }
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }

    ndkVersion '23.1.7779620'
}

dependencies {
    compileOnly BuildConfig.libs.androidx_appcompat.path
    compileOnly BuildConfig.libs.androidx_material.path
}