#
# qmake configuration for linux-g++ with modifications for building with OpenEmbedded
#

MAKEFILE_GENERATOR	= UNIX
CONFIG += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)

# QMAKE_<TOOL> (moc, uic, rcc) are gone, overwrite only ar and strip
QMAKE_AR              = $(REC_QMAKE_AR) cqs
QMAKE_STRIP           = $(REC_QMAKE_STRIP)
QMAKE_WAYLAND_SCANNER = $(REC_QMAKE_WAYLAND_SCANNER)

include(../common/gcc-base-unix.conf)

# *FLAGS from gcc-base.conf
QMAKE_CFLAGS                += $(REC_QMAKE_CFLAGS)
QMAKE_CXXFLAGS              += $(REC_QMAKE_CXXFLAGS)
QMAKE_LFLAGS                += $(REC_QMAKE_LDFLAGS)

include(../common/g++-unix.conf)

# tc settings from g++-base.conf
QMAKE_COMPILER = $(REC_QMAKE_COMPILER) gcc
QMAKE_CC       = $(REC_QMAKE_CC)
QMAKE_CXX      = $(REC_QMAKE_CXX)

QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO += $(REC_QMAKE_CFLAGS)

QMAKE_LINK         = $(REC_QMAKE_LINK)
QMAKE_LINK_SHLIB   = $(REC_QMAKE_LINK)
QMAKE_LINK_C       = $(REC_QMAKE_LINK)
QMAKE_LINK_C_SHLIB = $(REC_QMAKE_LINK)

# for the SDK
isEmpty(QMAKE_QT_CONFIG):QMAKE_QT_CONFIG = $(REC_QMAKE_QT_CONFIG)

load(qt_config)
